name: CI

on: 
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest 

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4.2.2

        - name: install dependencies
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '25'
            cache: 'maven'
          
        - name: Verification 
          run: mvn -B clean verify

          
